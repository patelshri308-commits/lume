[pytest]
# Run pytest from the backend/ directory: cd backend && pytest
pythonpath = .
testpaths  = tests

# Markers used in this project:
#   live  — tests that call external APIs (USDA, Open Food Facts).
#           Excluded from the default run; opt in with:  pytest -m live
markers =
    live: marks tests that call external APIs and may be slow or flaky (deselect with '-m "not live"')
